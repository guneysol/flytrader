<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fly Trader Report</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1b18; --muted:#6f6a62; --card:#fff; --line:#e7e3dc;
          --price:#3b5bdb; --buy:#2b8a3e; --sell:#e03131; --mn9:#f08c00; --gf:#c2255c; --val:#7048e8; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
          --bg:#141311; --fg:#ece9e3; --muted:#a29d94; --card:#1d1b18; --line:#2e2b27;
          --price:#748ffc; --buy:#51cf66; --sell:#ff6b6b; --mn9:#ffa94d; --gf:#f06595; --val:#9775fa; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; }
  main { max-width:1080px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:28px; margin:0 0 4px; } .sub { color:var(--muted); margin:0 0 24px; }
  .hero { font-size:22px; margin:0 0 20px; } .hero b { font-size:34px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-bottom:20px; }
  .stat, .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat .k { color:var(--muted); font-size:13px; } .stat .v { font-size:22px; font-weight:650; font-variant-numeric:tabular-nums; }
  .card { margin-bottom:16px; } .card h2 { font-size:15px; margin:0 0 10px; }
  canvas { width:100% !important; } .chart { position:relative; height:280px; } .chart.sm { height:180px; }
  table { width:100%; border-collapse:collapse; font-size:13px; font-variant-numeric:tabular-nums; }
  td, th { text-align:left; padding:5px 8px; border-bottom:1px solid var(--line); }
  .pos { color:var(--buy); } .neg { color:var(--sell); }
  .tablewrap { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>🪰 Fly Trader</h1>
  <p class="sub" id="sub"></p>
  <p class="hero" id="hero"></p>
  <div class="stats" id="stats"></div>
  <div class="card"><h2>Price and the fly's trades</h2><div class="chart"><canvas id="price"></canvas></div></div>
  <div class="card"><h2>Brain activity: proboscis (MN9 → buy) vs giant fiber escape (GF → sell)</h2><div class="chart sm"><canvas id="brain"></canvas></div></div>
  <div class="card"><h2>Fly vs every human wallet that traded (ROI)</h2><div class="chart sm"><canvas id="hist"></canvas></div></div>
  <div class="card"><h2>Trades</h2><div class="tablewrap"><table id="trades"></table></div></div>
</main>
<script>
const D = /*DATA*/null;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const pct = x => (x == null ? "–" : (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%");
const r = D.res, fl = r.fly, w = r.wallets;
document.getElementById("sub").textContent = `${r.name} · ${r.minutes} minutes · ${r.swaps.toLocaleString()} swaps · paper trading, $100 per entry, fees included`;
document.getElementById("hero").innerHTML = w.n
  ? `A fruit fly brain beat <b>${Math.round(w.fly_beats_pct * 100)}%</b> of the ${w.n.toLocaleString()} wallets trading this coin.`
  : `The fly made ${fl.trades} trades.`;
const stats = [["Fly ROI", pct(fl.roi)], ["Fly PnL", (fl.pnl_usd >= 0 ? "+" : "") + "$" + fl.pnl_usd.toFixed(2)],
  ["Win rate", Math.round(fl.win_rate * 100) + "%"], ["Trades", fl.trades],
  ["Median human ROI", pct(w.median_roi)], ["Humans profitable", w.n ? Math.round(w.pct_profitable * 100) + "%" : "–"],
  ["Buy & hold", pct(r.buy_and_hold_roi)], ["Random monkey", pct(r.random_trader_roi_median)]];
document.getElementById("stats").innerHTML = stats.map(([k, v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");

Chart.defaults.color = css("--muted"); Chart.defaults.borderColor = css("--line");
const idx = Object.fromEntries(D.t.map((t, i) => [t, i]));
const tick = { maxTicksLimit: 8, callback(v) { return (this.getLabelForValue(v) || "").slice(11, 16); } };
const buys = D.trades.filter(x => x.side === "buy"), sells = D.trades.filter(x => x.side === "sell");
new Chart(document.getElementById("price"), { type: "line",
  data: { labels: D.t, datasets: [
    { label: "price", data: D.close, borderColor: css("--price"), borderWidth: 1.5, pointRadius: 0 },
    { label: "fly buys", type: "scatter", data: buys.map(x => ({ x: x.t, y: x.price })), backgroundColor: css("--buy"), pointRadius: 5, pointStyle: "triangle" },
    { label: "fly sells", type: "scatter", data: sells.map(x => ({ x: x.t, y: x.price })), backgroundColor: css("--sell"), pointRadius: 5, pointStyle: "rectRot" } ] },
  options: { maintainAspectRatio: false, animation: false, scales: { x: { ticks: tick }, y: { type: "logarithmic", ticks: { maxTicksLimit: 6, callback: v => Number(v).toExponential(1) } } },
    plugins: { tooltip: { callbacks: { label: c => c.dataset.label === "price" ? Number(c.raw).toExponential(3)
      : `${c.dataset.label}: ${(c.dataset.label === "fly sells" ? sells : buys)[c.dataIndex].reason || ""}` } } } } });
new Chart(document.getElementById("brain"), { type: "line",
  data: { labels: D.brain_t, datasets: [
    { label: "MN9 proboscis (Hz)", data: D.brain.mn9, borderColor: css("--mn9"), borderWidth: 1, pointRadius: 0 },
    { label: "Giant fiber (Hz)", data: D.brain.gf, borderColor: css("--gf"), borderWidth: 1, pointRadius: 0 } ] },
  options: { maintainAspectRatio: false, animation: false, scales: { x: { ticks: tick } } } });
const bins = Array.from({ length: 31 }, (_, i) => -1 + i * 0.1);
const counts = bins.map(() => 0); D.wallet_roi.forEach(v => counts[Math.min(30, Math.max(0, Math.round((Math.min(v, 2) + 1) * 10)))]++);
const flyBin = Math.min(30, Math.max(0, Math.round((Math.min(fl.roi, 2) + 1) * 10)));
new Chart(document.getElementById("hist"), { type: "bar",
  data: { labels: bins.map(b => (b * 100).toFixed(0) + "%"), datasets: [{ label: "wallets", data: counts,
    backgroundColor: bins.map((_, i) => i === flyBin ? css("--mn9") : css("--line")) }] },
  options: { maintainAspectRatio: false, animation: false, plugins: { legend: { display: false },
    title: { display: true, text: "🪰 orange bar = where the fly landed", color: css("--muted") } } } });
document.getElementById("trades").innerHTML = "<tr><th>time</th><th>side</th><th>price</th><th>return</th><th>why</th></tr>" +
  D.trades.map(x => `<tr><td>${x.t.slice(5, 16)}</td><td>${x.side}</td><td>${Number(x.price).toExponential(3)}</td>
    <td class="${x.ret > 0 ? "pos" : x.ret < 0 ? "neg" : ""}">${x.ret == null ? "" : pct(x.ret)}</td><td>${esc(x.reason || "")}</td></tr>`).join("");
</script>
</body>
</html>
